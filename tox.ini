;  See https://tox.wiki/en/stable/
[tox]
requires =
    tox>=4
    tox-uv
envlist =
    doc
skip_missing_interpreters = true


; ENVIRONMENTS
; ------------
[min_python]
description = minimum python version
base_python = 3.10


[global_var]
passenv =
    CI
    # Pass user color preferences through
    PY_COLORS
    FORCE_COLOR
    NO_COLOR
    CLICOLOR
    CLICOLOR_FORCE


; COMMANDS
; --------
[testenv:doc]
description = Build doc with minimum supported version of python and all doc dependencies.
base_python = {[min_python]base_python}
passenv =
    {[global_var]passenv}
    PATTERN
    NILEARN_DATA
    SCIKIT_LEARN_DATA
    _MNE_FAKE_HOME_DIR
extras =
    doc
uv_resolution = lowest-direct
allowlist_externals =
    make
commands =
    make --directory docs clean
    make --directory docs linkcheck
    make --directory docs {posargs:}
