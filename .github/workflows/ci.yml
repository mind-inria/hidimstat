# Management of the action do made during a pull request

name: 'CI'
on:
  pull_request:
    # Using 'pull_request' instead of 'pull_request_target' is better for malicious PR as it :
    # 1. Gives only a read access
    # 2. Forbids access to Github secrets
    # 3. Runs in the context of the PR, and not on the base repository's target branch.
    branches: main
  # allows to push on branches
  push:
    branches: main

# disable all the permission for the workflow
permissions: {}

# Cancel existing runs
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  get_information:
    name: Get Information
    # information is: commit message for PR
    runs-on: ubuntu-latest
    outputs:
      COMMIT_MSG: ${{ steps.get_commit_message.outputs.COMMIT_MSG }}
      BRANCH_NAME: ${{ steps.get_branch_name.outputs.BRANCH_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 3
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # require to get the previous commit for getting their messages
          # in a PR the last commit is the commit merge with main

      - name: Get commit message
        id: get_commit_message
        # return an empty message when the event is not from a PR
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "COMMIT_MSG<<$EOF" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "COMMIT_MSG=$(git log -1 --pretty=%B ${{ github.event.pull_request.head.sha }})" # use for debugging
            echo "$(git log -1 --pretty=%B ${{ github.event.pull_request.head.sha }})" >> $GITHUB_OUTPUT
            echo "$EOF" >> $GITHUB_OUTPUT
          else
            echo "$EOF" >> $GITHUB_OUTPUT
          fi

      - name: Get branch name
        id: get_branch_name
        run: |
          echo "BRANCH_NAME=${{ github.event.pull_request.head.ref || github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME_VAL: ${{ steps.get_branch_name.outputs.BRANCH_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          DOC_FLAG: ${{ contains(steps.get_commit_message.outputs.COMMIT_MSG, '[doc ') }}
        run: |
          mkdir -p pr-meta
          echo "$BRANCH_NAME_VAL" > pr-meta/branch_name.txt
          echo "$PR_NUMBER" > pr-meta/pr_number.txt
          echo "$PR_DRAFT" > pr-meta/pr_draft.txt
          echo "$DOC_FLAG" > pr-meta/doc_flag.txt

      - name: Upload PR metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          path: pr-meta
          if-no-files-found: error


  tests:
    name: tests
    needs: [get_information]
    uses: ./.github/workflows/call_test_package.yml
    with:
      skip_test: ${{ contains(needs.get_information.outputs.COMMIT_MSG, '[skip tests]') || github.event.pull_request.draft }}

  tests_minimal:
    name: tests minimal
    needs: [get_information]
    uses: ./.github/workflows/call_test_minimal.yml
    with:
      skip_test: ${{ contains(needs.get_information.outputs.COMMIT_MSG, '[skip tests]') || github.event.pull_request.draft }}
