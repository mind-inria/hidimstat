---
# Workflow to build the documentation.
#
# - build doc and upload it as artifact
# - on ``main`` (or on github release): deploy the dev (or stable) doc
#   to https://github.com/hidimstat/hidimstat.github.io
#
# .. admonition:: Control via commit message
#    :class: tip
#
#    This workflow can be controlled if your commit message contains:
#
#    - ``[full doc]`` runs a full build on pull-request.
#    - ``[skip doc]`` skip build of the documentation.
#    - ``[example] name_of_example.py`` trigger build of some specific examples.
#
# On Pull Requests, "partial builds" are run by default which render all the rst files,
# but only build examples modified in the Pull Request.
# This saves time and resources when working on Pull Requests.
#
# Occasionally, some changes necessitate rebuilding the documentation from scratch,
# for example to see the full effect of the changes.
# These are called "full builds".
#
# You can request a full build from a Pull Request at any time by including the tag ``[full doc]`` in your commit message.
#
# .. code-block:: bash
#
#   $ git commit --message "[full doc] request full build"
#
# Full builds are always run on "main".
# This is done every time there is a push on "main".
#
# Most of this workflow is skipped if ``[skip doc]`` is in the commit message.
#
# Though partial builds will build modified examples,
# sometimes code changes on the module side could affect the plots in unmodified examples.
# For this, you can request for the CI to build a specific example
# by using the tag ``[example]`` and the name of the example.
# This is useful when wanting to get quick feedback from reviewers.
#
# .. code-block:: bash
#
#   $ git commit --message "[example] plot_cfi.py"
#
# However for quick checks to do yourself
# you should always opt for local builds.
#
###
name: DocumentationBuilder

on:
    push:
        branches:
        -   main
    pull_request:
        branches:
        -   '*'

    # This enables manual triggering from GitHub UI
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    workflow_dispatch:

    # This will run automatically when a release is published
    release:
        types: [published]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Force to use color
    FORCE_COLOR: true
    MIN_PYTHON_VERSION: '3.10'

jobs:
    check_skip_flags:
        uses: ./.github/workflows/check_skip_flags.yml
        with:
            skip_type: doc


    # Check the build type and files examples to generate
    # Upload as an artifact for other jobs.
    build_type:
        needs: [check_skip_flags]
        # Downstream jobs (build_docs, deploy_on_main) are skipped as well
        # since a skipped dependency propagates.
        if: needs.check_skip_flags.outputs.skip != 'true'
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v7
            with:
                  # If pull request, checkout HEAD commit with all commit history
                ref: ${{ github.event.pull_request.head.sha }}
                fetch-depth: 0
        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: ${{ env.MIN_PYTHON_VERSION }}
        -   name: Install dependencies
            run: python -m pip install --upgrade pip rich
        -   name: Merge with upstream
            run: ./tools/documentation/github/merge_upstream.sh
        -   name: Check if we are doing a full or partial build
            run: python ./tools/documentation/github/build_type.py
            env:
                COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        -   name: Verify build type
            run: |
                echo "PATTERN = $(cat pattern.txt)"
                echo "BUILD = $(cat build.txt)"
        -   name: Upload build.txt and pattern.txt
            uses: actions/upload-artifact@v7
            with:
                name: build_type
                path: |
                    build.txt
                    pattern.txt
                retention-days: 1
                overwrite: true

    # Steps to build the documentation.
    build_docs:
        needs: [build_type]
        runs-on: ubuntu-latest
        env:
            NILEARN_DATA: /home/runner/work/hidimstat/hidimstat/nilearn_data
            SCIKIT_LEARN_DATA: /home/runner/work/hidimstat/hidimstat/sklearn_data
            _MNE_FAKE_HOME_DIR: /home/runner/work/hidimstat/hidimstat/mne_data
            HF_HOME: /home/runner/work/hidimstat/hidimstat/huggingface

        defaults:
            run:
                shell: bash -el {0}

        steps:
        -   name: Checkout
            uses: actions/checkout@v7
            with:
                # If pull request, checkout HEAD commit with all commit history
                ref: ${{ github.event.pull_request.head.sha }}
                fetch-depth: 0
        -   name: Merge with upstream
            run: ./tools/documentation/github/merge_upstream.sh

            # Set up environment
        -   name: Install apt packages
            run: |
                sudo -E apt-get -yq update
                sudo -E apt-get -yq --no-install-suggests --no-install-recommends install \
                    dvipng texlive-latex-base texlive-latex-extra

        -   name: Install the latest version of uv
            uses: astral-sh/setup-uv@v7

        -   name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: ${{ env.MIN_PYTHON_VERSION }}

        -   name: Download build type
            uses: actions/download-artifact@v8
            with:
                name: build_type

        -   name: Install tox
            run: uv tool install tox --with=tox-uv

        -   name: Show tox config
            run: tox c

        -   name: Key for cache based on month number
            run: date +%m > month_num;

        -   name: Restore monthly data cache
            id: restore-monthly-cache
            uses: actions/cache/restore@v6
            with:
                path: |
                    nilearn_data
                    sklearn_data
                    mne_data
                    huggingface
                key: data_cache-${{ github.workflow }}_month-${{ hashFiles('month_num') }}

        -   name: Create data cache dir
            # necessary if previous step failed (e.g github cache was deleted)
            # ensure we can write to them
            run: |
                mkdir -p mne_data nilearn_data sklearn_data huggingface
                chmod +w mne_data nilearn_data sklearn_data huggingface

            # Run the doc build
            #
            # We let tox handle creating virtual env and install dependencies.
        -   name: Build docs
            id: build-docs
            run: |
                set -o pipefail;
                export PATTERN=$(cat pattern.txt)
                tox run \
                    --colored yes \
                    --list-dependencies \
                    -e doc -- $(cat build.txt) 2>&1 | tee log.txt;

        -   name: Upload build log
            if: always()
            uses: actions/upload-artifact@v7
            with:
                name: doc_build_log
                path: log.txt
                if-no-files-found: ignore

        # The artifact name 'doc' is used by the deploy_on_main job
        # and by the CircleCI host_docs job (doc.zip).
        -   name: Upload documentation
            uses: actions/upload-artifact@v7
            with:
                name: doc
                path: docs/_build/html

        -   name: Save monthly data cache
            uses: actions/cache/save@v6
            with:
                path: |
                    nilearn_data
                    sklearn_data
                    mne_data
                key: data_cache-${{ github.workflow }}_month-${{ hashFiles('month_num') }}


    deploy_on_main:
        runs-on: ubuntu-latest
        needs: [build_docs]
        # Manual runs (workflow_dispatch) only deploy when started from main,
        # to avoid overwriting the dev doc with a feature branch.
        if: >
            github.repository == 'mind-inria/hidimstat' &&
            (
                github.event_name == 'push' ||
                github.event_name == 'release' ||
                (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
            )
        steps:
        -   name: Checkout
            uses: actions/checkout@v7
            with:
                fetch-depth: 0

        -   name: Add SSH key
            env:
                SSH_AUTH_SOCK: /tmp/ssh_agent.sock
                # Pass the secret through the environment
                # so it is not interpolated into the script itself.
                ACTIONS_SSH_DEPLOY: ${{ secrets.ACTIONS_SSH_DEPLOY }}
            run: |
                if [ -z "$ACTIONS_SSH_DEPLOY" ]; then
                    echo "::error::The ACTIONS_SSH_DEPLOY secret is not set. Add a deploy key with write access to hidimstat/hidimstat.github.io and store its private key as ACTIONS_SSH_DEPLOY in this repository."
                    exit 1
                fi
                mkdir -p ~/.ssh
                ssh-keyscan github.com >> ~/.ssh/known_hosts
                printf '%s\n' "$ACTIONS_SSH_DEPLOY" > ~/.ssh/github_actions
                chmod 600 ~/.ssh/github_actions
                ssh-agent -a $SSH_AUTH_SOCK > /dev/null
                ssh-add ~/.ssh/github_actions

        -   uses: actions/download-artifact@v8
            with:
                name: doc
                path: docs/_build/html

        -   name: Identify deploy type
            id: deploy-type
            run: |
                if ${{ contains(fromJSON('["release"]'), github.event_name)}}; then
                    echo "DEPLOY_TYPE=stable" >> $GITHUB_OUTPUT
                else
                    echo "DEPLOY_TYPE=dev" >> $GITHUB_OUTPUT
                fi

        -   name: deploy
            env:
                SSH_AUTH_SOCK: /tmp/ssh_agent.sock
                COMMIT_SHA: ${{ github.event.head_commit.id }}
                DEPLOY_TYPE: ${{ steps.deploy-type.outputs.DEPLOY_TYPE }}
            run: |
                git config --global user.email "actions@github.com"
                git config --global user.name "GitHub actions"
                ./tools/documentation/github/deploy_doc.sh
