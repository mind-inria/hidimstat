version: 2.1

# Parameters required to trigger the execution of the "host_docs" job
parameters:
    GITHUB_RUN_URL:
        type: string
        default: none

workflows:
    wait:
        jobs:
        - wait-action
    # Both workflows are triggered from GitHub Actions with GITHUB_RUN_URL set:
    # - by ci_publish_call.yml with a URL to pytest-results-all.zip
    # - by trigger_hosting_on_pr.yml with a URL to the doc build run
    host_docs_on_pr:
        when:
            and:
            -   not:
                    equal: [none, << pipeline.parameters.GITHUB_RUN_URL >>]
            -   not:
                    matches:
                        pattern: .*pytest-results-all\.zip$
                        value: << pipeline.parameters.GITHUB_RUN_URL >>
        jobs:
        -   host_docs

    host_reports:
        when:
            matches:
                pattern: .*pytest-results-all\.zip$
                value: << pipeline.parameters.GITHUB_RUN_URL >>
        jobs:
        - get-tests-reports

jobs:
    host_docs:
        machine:
            image: ubuntu-2204:current
        environment:
            GITHUB_ARTIFACT_URL: << pipeline.parameters.GITHUB_RUN_URL >>/doc.zip
        steps:
        -   checkout
        -   run:
                name: Download documentation
                command: bash tools/documentation/circleci/download_documentation.sh
        -   store_artifacts:
                path: docs/_build/html/
                destination: dev

    get-tests-reports:
        docker:
        - image: cimg/base:2025.05
        environment:
        - GITHUB_ARTIFACT_URL: << pipeline.parameters.GITHUB_RUN_URL >>
        steps:
        - checkout
        - run:
            name: "get reports"
            command: |
                set -x -e
                wget $GITHUB_ARTIFACT_URL
                unzip pytest-results-all.zip -d test_reports
                mkdir -p docs/_build/html
                mv test_reports docs/_build/html
        # store the reports to display for a PR
        - store_artifacts:
            path: docs/_build/html/test_reports
            destination: documentation/test_reports


    # this action is only to avoid any error
    wait-action:
        docker:
        - image: cimg/base:2025.05
        steps:
        - run:
                name: "wait"
                command: sleep 10
